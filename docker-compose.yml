services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      DATABASE_URL: postgresql://jpr_app:jpr_app@db:5432/jpr
      MIGRATION_DATABASE_URL: postgresql://jpr_migrator:jpr_migrator@db:5432/jpr
      SYSTEM_USER_ID: 00000000-0000-0000-0000-000000000001
      JWT_SECRET: dev-jwt-secret-change-this-in-production-32chars
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: jpr-uploads
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_DEFAULT_LOCALE: ta
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

  # One-shot: apply drizzle migrations + seed as jpr_migrator before app starts.
  migrate:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://jpr_app:jpr_app@db:5432/jpr
      MIGRATION_DATABASE_URL: postgresql://jpr_migrator:jpr_migrator@db:5432/jpr
      SYSTEM_USER_ID: 00000000-0000-0000-0000-000000000001
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jpr
      POSTGRES_PASSWORD: jpr
      POSTGRES_DB: jpr
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpr -d jpr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Browser-based Postgres GUI. Open http://localhost:8080
  # System: PostgreSQL, Server: db, User: jpr, Password: jpr, Database: jpr
  adminer:
    image: adminer:4-standalone
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # MinIO bucket creation (runs once)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/jpr-uploads;
      mc anonymous set download local/jpr-uploads;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
  node_modules:
  next_cache:
